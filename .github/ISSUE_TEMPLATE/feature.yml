name: Feature request
description: Suggest something new for the website or for @chassis-ui/docs
labels: [enhancement, needs-triage]
body:
  - type: dropdown
    id: area
    attributes:
      label: Where
      options:
        - The website, chassis-ui.com
        - The package, @chassis-ui/docs
        - The examples
        - Building or running this repository
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you'd like
      description: For the package, the config key, component or API you have in mind. A sketch is fine.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you've tried
      description: Including workarounds that do work.
