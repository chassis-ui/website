name: Lint (reusable)

# Lints a Chassis repository. Called by ci.yml here, and by the sibling repositories as
# chassis-ui/website/.github/workflows/reusable-lint.yml@<ref>. See "Reusable workflows"
# in ref/DEPLOYMENT.md.
on:
  workflow_call:
    inputs:
      command:
        description: The commands to run, one per line. The job stops at the first that fails
        type: string
        default: pnpm lint
      node-version:
        description: The Node.js version. Empty reads node-version-file
        type: string
        default: ''
      node-version-file:
        description: The file with the Node.js version, in the caller's repository
        type: string
        default: '.nvmrc'
      install-command:
        description: The command that installs the dependencies
        type: string
        default: pnpm install --frozen-lockfile

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ inputs.node-version }}
          node-version-file: ${{ inputs.node-version == '' && inputs.node-version-file || '' }}
          cache: 'pnpm'

      - name: Install dependencies
        run: ${{ inputs.install-command }}

      - name: Lint
        run: ${{ inputs.command }}
