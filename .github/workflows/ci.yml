name: CI

on:
  push:
    # A commit reaches `staging` and `main` only after these checks passed on it, so they
    # run on `develop` first. Their results belong to the commit, and the ruleset and the
    # publish workflow read them there, so pushing the same commit to `staging` and `main`
    # does not run them again. See ref/DEPLOYMENT.md.
    branches: [develop]
  pull_request:
    branches: [staging, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: ESLint (website)
        run: pnpm site:lint:eslint

      - name: ESLint (docs)
        run: pnpm docs:lint:eslint

      - name: Stylelint (website)
        run: pnpm site:lint:stylelint

      - name: Stylelint (docs)
        run: pnpm docs:lint:stylelint

      - name: Prettier (website)
        run: pnpm site:lint:prettier

      - name: Prettier (docs)
        run: pnpm docs:lint:prettier

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Astro type check
        run: pnpm check:astro

  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Unit and component tests
        run: pnpm test

  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # vendor/assets is built at the commit pinned in this repository
          submodules: true

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build site
        run: pnpm site:build

      - name: Validate HTML (html-validate)
        run: pnpm site:lint:html

      - name: Validate HTML (Nu Html Checker)
        run: pnpm site:lint:vnu

  fixtures:
    name: Fixture Site (${{ matrix.layout }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # See build/fixture-sites.js
        layout: [root, packages]

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # The starter copies the docs build of chassis-assets, as every Chassis site does
          submodules: true

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'pnpm'

      # Packs @chassis-ui/docs and installs it into the starter site, outside the workspace
      - name: Build the starter site from the packed package
        run: pnpm test:fixtures ${{ matrix.layout }}

  audit:
    name: Security Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit dependencies
        run: pnpm check:pnpm

  dependency-review:
    name: Dependency Review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Review dependency changes
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: moderate
