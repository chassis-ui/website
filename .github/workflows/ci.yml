name: CI

on:
  push:
    # A commit reaches `staging` and `main` only after these checks passed on it, so they
    # run on `develop` first. Their results belong to the commit, and the ruleset and the
    # publish workflow read them there, so pushing the same commit to `staging` and `main`
    # does not run them again. See ref/DEPLOYMENT.md.
    branches: [develop]
  pull_request:
    # Contributors open pull requests against `develop`
    branches: [develop, staging, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Lint, Type Check and Build call the reusable workflows that the sibling repositories call
  # too, so every push tests them. GitHub names their checks "Lint / Lint" and so on.
  lint:
    name: Lint
    uses: ./.github/workflows/reusable-lint.yml

  typecheck:
    name: Type Check
    uses: ./.github/workflows/reusable-typecheck.yml

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Unit and component tests
        run: pnpm test

  build:
    name: Build
    uses: ./.github/workflows/reusable-build.yml
    with:
      # vendor/assets is built at the commit pinned in this repository. Axe runs in the
      # Chrome that the runner has installed
      checks: |
        pnpm site:lint:html
        pnpm site:lint:vnu
        pnpm site:lint:links
        pnpm site:lint:a11y

  fixtures:
    name: Fixture Site (${{ matrix.layout }})
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        # See build/fixture-sites.js
        layout: [root, packages]

    steps:
      # No submodule: the fixture writes a stand-in for the docs build of chassis-assets
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      # Packs @chassis-ui/docs and installs it into the starter site, outside the workspace
      - name: Build the starter site from the packed package
        run: pnpm test:fixtures ${{ matrix.layout }}

  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit dependencies
        run: pnpm check:pnpm

  dependency-review:
    name: Dependency Review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
