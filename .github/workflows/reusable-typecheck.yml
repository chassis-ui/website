name: Type Check (reusable)

# Type-checks a Chassis repository. Called by ci.yml here, and by the sibling repositories
# as chassis-ui/website/.github/workflows/reusable-typecheck.yml@<ref>. See "Reusable
# workflows" in ref/DEPLOYMENT.md.
on:
  workflow_call:
    inputs:
      command:
        description: The commands to run, one per line. The job stops at the first that fails
        type: string
        default: pnpm check:astro
      node-version:
        description: The Node.js version. Empty reads node-version-file
        type: string
        default: ''
      node-version-file:
        description: The file with the Node.js version, in the caller's repository
        type: string
        default: '.nvmrc'
      install-command:
        description: The command that installs the dependencies
        type: string
        default: pnpm install --frozen-lockfile
      timeout-minutes:
        description: The minutes after which the job is cancelled
        type: number
        default: 10

permissions:
  contents: read

jobs:
  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ inputs.node-version }}
          node-version-file: ${{ inputs.node-version == '' && inputs.node-version-file || '' }}
          cache: 'pnpm'

      - name: Install dependencies
        run: ${{ inputs.install-command }}

      - name: Type check
        run: ${{ inputs.command }}
