name: Lighthouse Performance

on:
  deployment_status:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to test'
        required: false
        default: 'production'
        type: choice
        options: [production, staging]

permissions:
  contents: read

concurrency:
  group: lighthouse-${{ github.event.deployment.environment || github.event.inputs.environment || 'manual' }}
  cancel-in-progress: true

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    # Only run on successful deployments or manual triggers
    if: github.event_name == 'workflow_dispatch' || github.event.deployment_status.state == 'success'

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Determine base URL
        id: base-url
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            ENV="${{ github.event.inputs.environment }}"
          elif [[ "${{ github.event.deployment.ref }}" == "staging" ]] || [[ "${{ github.event.deployment.environment }}" == *"staging"* ]] || [[ "${{ github.event.deployment.environment }}" == *"Preview"* ]]; then
            ENV="staging"
          else
            ENV="production"
          fi

          if [[ "$ENV" == "staging" ]]; then
            echo "url=https://staging.chassis-ui.com" >> $GITHUB_OUTPUT
          else
            echo "url=https://chassis-ui.com" >> $GITHUB_OUTPUT
          fi
          echo "env=$ENV" >> $GITHUB_OUTPUT
          echo "Testing $ENV: $(cat $GITHUB_OUTPUT | grep '^url=' | cut -d= -f2)"

      - name: Fetch URLs from sitemap
        id: sitemap
        run: |
          BASE="${{ steps.base-url.outputs.url }}"
          HTTP_CODE=$(curl -s -o /tmp/sitemap.xml -w "%{http_code}" "$BASE/sitemap-0.xml")
          if [ "$HTTP_CODE" != "200" ]; then
            echo "::error::Failed to fetch sitemap from $BASE/sitemap-0.xml (HTTP $HTTP_CODE)"
            exit 1
          fi

          URLS=$(grep -o '<loc>[^<]*</loc>' /tmp/sitemap.xml | sed 's/<loc>//;s/<\/loc>//' | grep -v '/404')
          if [ -z "$URLS" ]; then
            echo "::error::No URLs found in sitemap at $BASE/sitemap-0.xml"
            exit 1
          fi

          echo "Found URLs:"
          echo "$URLS"
          {
            echo "urls<<EOF"
            echo "$URLS"
            echo "EOF"
          } >> $GITHUB_OUTPUT

      - name: Run Lighthouse
        id: lighthouse
        # 12.x: Lighthouse 10 in v10 cannot parse oklch() colours, so the accessibility
        # category of every Chassis page came back without a score.
        uses: treosh/lighthouse-ci-action@3e7e23fb74242897f95c0ba9cabad3d0227b9b18 # 12.6.2
        with:
          urls: ${{ steps.sitemap.outputs.urls }}
          configPath: './lighthouse.json'
          runs: 3
          uploadArtifacts: false
          temporaryPublicStorage: true

      - name: Upload Lighthouse results
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-report
          path: .lighthouseci/
