name: Publish Packages

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      docs-changed: ${{ steps.changes.outputs.docs-changed }}
      docs-version: ${{ steps.version.outputs.docs-version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2 # Need at least 2 commits to compare

      - name: Check for package changes
        id: changes
        run: |
          # Check if docs package.json version changed
          if git diff HEAD~1 HEAD --name-only | grep -q "packages/docs/package.json"; then
            echo "Package.json changed, checking version..."

            # Get current and previous version
            CURRENT_VERSION=$(node -p "require('./packages/docs/package.json').version")
            git checkout HEAD~1
            PREVIOUS_VERSION=$(node -p "require('./packages/docs/package.json').version")
            git checkout -

            echo "Current version: $CURRENT_VERSION"
            echo "Previous version: $PREVIOUS_VERSION"

            if [ "$CURRENT_VERSION" != "$PREVIOUS_VERSION" ]; then
              echo "docs-changed=true" >> $GITHUB_OUTPUT
              echo "Version changed from $PREVIOUS_VERSION to $CURRENT_VERSION"
            else
              echo "docs-changed=false" >> $GITHUB_OUTPUT
              echo "Version unchanged"
            fi
          else
            echo "docs-changed=false" >> $GITHUB_OUTPUT
            echo "Package.json not changed"
          fi

      - name: Get current version
        id: version
        run: |
          VERSION=$(node -p "require('./packages/docs/package.json').version")
          echo "docs-version=$VERSION" >> $GITHUB_OUTPUT

  publish-docs:
    needs: detect-changes
    if: needs.detect-changes.outputs.docs-changed == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          registry-url: 'https://registry.npmjs.org'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.7.0

      - name: Install dependencies
        run: pnpm install

      - name: Publish @chassis-ui/docs
        working-directory: packages/docs
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_CHASSIS_DOCS }}

      - name: Create Release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: "@chassis-ui/docs@${{ needs.detect-changes.outputs.docs-version }}"
          release_name: "@chassis-ui/docs v${{ needs.detect-changes.outputs.docs-version }}"
          body: |
            Published @chassis-ui/docs v${{ needs.detect-changes.outputs.docs-version }} to npm.

            Install with:
            ```bash
            npm install @chassis-ui/docs@${{ needs.detect-changes.outputs.docs-version }}
            ```
          draft: false
          prerelease: false
