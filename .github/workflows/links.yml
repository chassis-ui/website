name: Links

# Crawls the deployed site, the proxied projects included, after each deployment. The
# Build job of CI checks the links of the built site before that. See build/check-links.js.

on:
  deployment_status:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to check'
        required: false
        default: 'production'
        type: choice
        options: [production, staging]

permissions:
  contents: read

concurrency:
  group: links-${{ github.event.deployment.environment || github.event.inputs.environment || 'manual' }}
  cancel-in-progress: true

jobs:
  links:
    name: Links
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Only run on successful deployments or manual triggers
    if: github.event_name == 'workflow_dispatch' || github.event.deployment_status.state == 'success'

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Determine base URL
        id: base-url
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            ENV="${{ github.event.inputs.environment }}"
          elif [[ "${{ github.event.deployment.ref }}" == "staging" ]] || [[ "${{ github.event.deployment.environment }}" == *"staging"* ]] || [[ "${{ github.event.deployment.environment }}" == *"Preview"* ]]; then
            ENV="staging"
          else
            ENV="production"
          fi

          if [[ "$ENV" == "staging" ]]; then
            echo "url=https://staging.chassis-ui.com" >> $GITHUB_OUTPUT
          else
            echo "url=https://chassis-ui.com" >> $GITHUB_OUTPUT
          fi

      # Fails on a broken link of this site. Those of the proxied projects are warnings.
      - name: Check links
        run: pnpm site:lint:links ${{ steps.base-url.outputs.url }}
