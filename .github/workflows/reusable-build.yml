name: Build (reusable)

# Builds the docs site of a Chassis repository and checks the output. Called by ci.yml
# here, and by the sibling repositories as
# chassis-ui/website/.github/workflows/reusable-build.yml@<ref>. See "Reusable workflows"
# in ref/DEPLOYMENT.md.
#
# The runner has Java, for `chassis-docs vnu`, and Google Chrome.
on:
  workflow_call:
    inputs:
      command:
        description: The build commands, one per line. The job stops at the first that fails
        type: string
        default: pnpm site:build
      checks:
        description: The commands that check the output, one per line. Empty skips the step
        type: string
        default: ''
      submodules:
        description: Checks out the submodules, which `chassis-docs vendor` builds. 'true', 'false' or 'recursive'
        type: string
        default: 'true'
      lfs:
        description: Pulls the Git LFS files, from a cache keyed by their ids
        type: boolean
        default: false
      node-version:
        description: The Node.js version. Empty reads node-version-file
        type: string
        default: ''
      node-version-file:
        description: The file with the Node.js version, in the caller's repository
        type: string
        default: '.nvmrc'
      install-command:
        description: The command that installs the dependencies
        type: string
        default: pnpm install --frozen-lockfile
      timeout-minutes:
        description: The minutes after which the job is cancelled
        type: number
        default: 20

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: ${{ inputs.submodules }}
          persist-credentials: false

      # The objects are cached by the list of their ids, so a run downloads only what
      # changed, which keeps the Git LFS bandwidth quota low. As in chassis-assets.
      - name: List Git LFS objects
        id: lfs
        if: inputs.lfs
        run: echo "ids=$(git lfs ls-files --long | cut -d ' ' -f1 | sort | sha256sum | cut -d ' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Cache Git LFS objects
        if: inputs.lfs
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .git/lfs
          key: lfs-${{ steps.lfs.outputs.ids }}
          restore-keys: lfs-

      - name: Pull Git LFS objects
        if: inputs.lfs
        run: git lfs pull

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ inputs.node-version }}
          node-version-file: ${{ inputs.node-version == '' && inputs.node-version-file || '' }}
          cache: 'pnpm'

      - name: Install dependencies
        run: ${{ inputs.install-command }}

      - name: Build
        run: ${{ inputs.command }}

      - name: Check the output
        if: inputs.checks != ''
        run: ${{ inputs.checks }}
