packages:
  - 'packages/*'
  - 'examples/*'

# Our own packages install at any age. Dependabot hands its 3-day cooldown to pnpm as a minimum
# release age when it re-resolves the lockfile, which rejects a Chassis release that develop
# already requires. A Chassis release can be an urgent fix between our packages. See the cooldown
# in .github/dependabot.yml, which exempts the same packages.
minimumReleaseAgeExclude:
  - '@chassis-ui/*'
