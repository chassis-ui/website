packages:
  - 'packages/*'

# Our own packages install at any age. Dependabot hands its 3-day cooldown to pnpm as a minimum
# release age when it re-resolves the lockfile, which rejects a Chassis release that develop
# already requires. A Chassis release can be an urgent fix between our packages. See the cooldown
# in .github/dependabot.yml, which exempts the same packages.
minimumReleaseAgeExclude:
  - '@chassis-ui/*'

# @astrojs/astro2tsx (under @astrojs/check) pins @emnapi/core but leaves @emnapi/runtime to peer
# resolution, which picks the 2.0 beta that rolldown 1.3 brings in. The mismatched pair throws on
# load and `astro check` reports @astrojs/check as missing. Give the runtime the same version as
# the core. Remove when astro2tsx declares it.
packageExtensions:
  '@astrojs/astro2tsx@0.1.2':
    dependencies:
      '@emnapi/runtime': 1.11.3
